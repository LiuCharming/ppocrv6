services:
  ocr-model:
    build:
      context: .
      dockerfile: Dockerfile.model
      args:
        BASE_IMAGE: ${BASE_IMAGE:-m.daocloud.io/docker.io/library/python:3.11-slim-bookworm}
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
        PADDLE_VERSION: ${PADDLE_VERSION:-3.2.0}
        PADDLE_INDEX_URL: ${PADDLE_INDEX_URL:-https://www.paddlepaddle.org.cn/packages/stable/cu118/}
    restart: unless-stopped
    environment:
      OCR_DEVICE: gpu:0
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      OCR_QUEUE_SIZE: ${OCR_QUEUE_SIZE:-16}
      PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-BOS}
      MODEL_SIZE: ${MODEL_SIZE:-medium}
      API_KEY: ${MODEL_API_KEY:-}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
    ports:
      - "${MODEL_BIND:-0.0.0.0}:${MODEL_PORT:-8001}:8000"
    volumes:
      - model-cache:/root/.paddlex
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  model-cache:
